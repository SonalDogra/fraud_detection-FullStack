<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit Logs')}"></head>
<body style="display:flex;">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<div class="main-content">
    <div class="topbar">
        <div>
            <div class="topbar-title">Audit Logs</div>
            <div class="topbar-breadcrumb">Complete history of all analyst actions</div>
        </div>
    </div>
    <div class="page-content">
        <div class="card-dark">
            <div class="card-header-custom">
                <div class="card-title">System Audit Trail</div>
            </div>
            <div style="overflow-x:auto;">
                <table class="table-dark-custom">
                    <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity Type</th>
                        <th>Entity ID</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${logs.content}">
                        <td style="font-size:0.72rem;color:var(--text-muted);white-space:nowrap;" th:text="${#temporals.format(log.timestamp, 'dd MMM yyyy HH:mm:ss')}"></td>
                        <td style="font-size:0.8rem;font-weight:600;" th:text="${log.username}"></td>
                        <td>
                            <span class="status-badge status-PENDING" style="font-size:0.65rem;" th:text="${log.action}"></span>
                        </td>
                        <td style="font-size:0.78rem;color:var(--text-secondary);" th:text="${log.entityType}"></td>
                        <td><span class="txn-id" style="font-size:0.72rem;" th:text="${log.entityId}"></span></td>
                        <td style="font-size:0.78rem;color:var(--text-secondary);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${log.details}"></td>
                    </tr>
                    <tr th:if="${logs.content.isEmpty()}">
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="bi bi-journal-text"></i>
                                <p>No audit entries yet.</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3" style="font-size:0.75rem;color:var(--text-secondary);">
                <span th:text="'Page ' + (${currentPage}+1) + ' of ' + ${logs.totalPages}"></span>
                <div class="pagination-custom">
                    <a th:href="@{/audit(page=${currentPage-1})}" class="page-btn" th:classappend="${currentPage == 0} ? 'disabled'"><i class="bi bi-chevron-left"></i></a>
                    <a th:href="@{/audit(page=${currentPage+1})}" class="page-btn" th:classappend="${currentPage + 1 >= logs.totalPages} ? 'disabled'"><i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
