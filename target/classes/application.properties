spring.application.name=Fraud Detection Platform

# Server
server.port=${PORT:8080}

# Database - H2 in-memory for development
spring.datasource.url=jdbc:h2:mem:frauddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.frauddetection=DEBUG
logging.level.org.springframework.security=WARN

# AI Configuration (OpenAI compatible)
ai.provider.url=${AI_API_URL:https://api.openai.com/v1}
ai.provider.key=${OPENAI_API_KEY:demo-key}
ai.provider.model=${AI_MODEL:gpt-4o-mini}
ai.demo.mode=${AI_DEMO_MODE:true}

# App
app.name=FraudGuard AI
app.version=1.0.0
