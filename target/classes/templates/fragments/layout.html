<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — FraudGuard AI'">FraudGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body>

<nav th:fragment="sidebar" class="sidebar d-flex flex-column">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <i class="bi bi-shield-fill-check"></i>
        </div>
        <div class="brand-text">
            <span class="brand-name">FraudGuard</span>
            <span class="brand-sub">AI Platform</span>
        </div>
    </div>

    <div class="sidebar-nav">
        <div class="nav-section-label">OPERATIONS</div>
        <a th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-link-item">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/transactions}" th:classappend="${activePage == 'transactions'} ? 'active'" class="nav-link-item">
            <i class="bi bi-arrow-left-right"></i>
            <span>Transactions</span>
        </a>
        <a th:href="@{/cases}" th:classappend="${activePage == 'cases'} ? 'active'" class="nav-link-item">
            <i class="bi bi-folder2-open"></i>
            <span>Case Management</span>
        </a>

        <div class="nav-section-label mt-3">INTELLIGENCE</div>
        <a th:href="@{/rules}" th:classappend="${activePage == 'rules'} ? 'active'" class="nav-link-item">
            <i class="bi bi-sliders"></i>
            <span>Rule Engine</span>
        </a>
        <a th:href="@{/chat}" th:classappend="${activePage == 'chat'} ? 'active'" class="nav-link-item">
            <i class="bi bi-robot"></i>
            <span>AI Assistant</span>
            <span class="badge-ai">AI</span>
        </a>

        <div class="nav-section-label mt-3">ADMIN</div>
        <a th:href="@{/audit}" th:classappend="${activePage == 'audit'} ? 'active'" class="nav-link-item">
            <i class="bi bi-journal-text"></i>
            <span>Audit Logs</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <span sec:authentication="name" class="text-uppercase" style="font-size:0.75rem;font-weight:700;"></span>
            </div>
            <div class="user-meta">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role" sec:authorize="hasRole('ADMIN')">Administrator</div>
                <div class="user-role" sec:authorize="hasRole('FRAUD_ANALYST')">Fraud Analyst</div>
            </div>
        </div>
        <a th:href="@{/logout}" class="btn-logout" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
        </a>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
